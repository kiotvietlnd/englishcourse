<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Learning Journey - Lesson 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8fafc;
            color: #1f2937;
        }

        /* Animations & 3D */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .flashcard-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        /* Custom UI Elements */
        .mini-card { height: 280px; }
        
        .drop-zone {
            display: inline-block;
            min-width: 140px;
            height: 38px;
            border-bottom: 3px dashed #6366f1;
            margin: 0 4px;
            vertical-align: middle;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
        }
        .drop-zone.filled {
            border: 2px solid #10b981;
            background-color: #ecfdf5;
            color: #065f46;
            font-weight: 800;
            border-radius: 10px;
            padding: 0 12px;
            line-height: 34px;
        }
        .draggable-word { cursor: grab; user-select: none; }
        .draggable-word:active { cursor: grabbing; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <div id="app" class="max-w-6xl mx-auto bg-white min-h-screen shadow-2xl relative overflow-hidden flex flex-col border-x border-gray-100">
        
        <!-- ================= LESSON VIEW ================= -->
        <div id="lesson-view" class="flex-1 flex flex-col h-full w-full bg-slate-50">
            <!-- Header -->
            <div class="bg-white px-8 py-5 flex items-center shadow-sm z-10 border-b border-gray-100">
                <button onclick="goHome()" class="w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-circle-xmark text-2xl"></i>
                </button>
                <div class="flex-1 mx-8">
                    <div class="flex justify-between text-sm font-bold text-gray-400 mb-2 uppercase tracking-widest">
                        <span id="lesson-title">Lesson 2: Review & Recall</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-3">
                        <div id="progress-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-700 shadow-sm" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Dynamic Content Area -->
            <div id="task-container" class="flex-1 overflow-y-auto p-8 lg:p-12 pb-32">
                <!-- Content injected by JS -->
            </div>

            <!-- Bottom Navigation -->
            <div id="global-nav" class="absolute bottom-0 w-full bg-white p-6 border-t border-gray-100 z-20 flex justify-center hidden">
                <div class="max-w-4xl w-full">
                    <button id="btn-next-global" onclick="handleNextTask()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-xl transition active:scale-95 text-lg">
                        Continue <i class="fa-solid fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
        
    </div>

    <script>
        // --- DATA ---
        const lessonData = {
            tasks: [
                {
                    type: "recall_flashcard",
                    title: "Activity 1: Quick Recall Sprint",
                    desc: "Look at the English & Vietnamese meanings. Type the correct English word to flip the card!",
                    items: [
                        // VOCABULARY (20)
                        { word: "subject", type: "n.", vn: "môn học", en: "an area you study at school" },
                        { word: "timetable", type: "n.", vn: "thời khóa biểu", en: "a list showing when lessons happen" },
                        { word: "assignment", type: "n.", vn: "bài tập được giao", en: "a piece of school work given by a teacher" },
                        { word: "homework", type: "n.", vn: "bài tập về nhà", en: "school work you do at home" },
                        { word: "project", type: "n.", vn: "dự án nhóm", en: "a piece of work that takes time and has a goal" },
                        { word: "presentation", type: "n.", vn: "bài thuyết trình", en: "a short talk to explain something" },
                        { word: "exam", type: "n.", vn: "kỳ thi", en: "a formal test of knowledge" },
                        { word: "test", type: "n./v.", vn: "bài kiểm tra", en: "a short way to check knowledge" },
                        { word: "grade", type: "n.", vn: "điểm số/xếp loại", en: "a score or level for school work" },
                        { word: "mark", type: "n.", vn: "điểm", en: "a number showing how good work is" },
                        { word: "revise", type: "v.", vn: "ôn tập", en: "study again before a test" },
                        { word: "memorize", type: "v.", vn: "ghi nhớ/học thuộc", en: "learn something so you can remember it" },
                        { word: "concentrate", type: "v.", vn: "tập trung", en: "give all your attention to something" },
                        { word: "distraction", type: "n.", vn: "sự xao nhãng", en: "something that stops you from focusing" },
                        { word: "deadline", type: "n.", vn: "hạn nộp", en: "the final time to finish something" },
                        { word: "notebook", type: "n.", vn: "vở ghi", en: "a book for writing notes" },
                        { word: "textbook", type: "n.", vn: "sách giáo khoa", en: "a book used for studying a subject" },
                        { word: "uniform", type: "n.", vn: "đồng phục", en: "special clothes students wear at school" },
                        { word: "classmate", type: "n.", vn: "bạn cùng lớp", en: "a student in the same class" },
                        { word: "teacher", type: "n.", vn: "giáo viên", en: "a person who teaches students" },
                        // COLLOCATIONS (9)
                        { word: "revise for a test", type: "collocation", vn: "ôn tập cho bài kiểm tra", en: "review materials before an exam" },
                        { word: "submit an assignment", type: "collocation", vn: "nộp bài được giao", en: "hand in school work" },
                        { word: "take notes", type: "collocation", vn: "ghi chú", en: "write down information" },
                        { word: "pay attention", type: "collocation", vn: "chú ý nghe", en: "listen and watch carefully" },
                        { word: "make a mistake", type: "collocation", vn: "mắc lỗi", en: "do something wrong" },
                        { word: "improve my English", type: "collocation", vn: "cải thiện tiếng Anh", en: "make my English better" },
                        { word: "solve a problem", type: "collocation", vn: "giải quyết vấn đề", en: "find an answer to a difficulty" },
                        { word: "work in groups", type: "collocation", vn: "làm việc nhóm", en: "study with other students" },
                        { word: "ask questions", type: "collocation", vn: "đặt câu hỏi", en: "say things to get more information" }
                    ]
                },
                {
                    type: "mcq_batch",
                    title: "Activity 2: Choose the Correct Phrase",
                    desc: "Select the correct collocation for each sentence. You must score 8/10 to pass!",
                    questions: [
                        { q: "I usually ________ before an important exam.", options: ["revise for a test", "revise a test"], ans: 0 },
                        { q: "During the lesson, our teacher asked us to ________.", options: ["pay attention", "give attention"], ans: 0 },
                        { q: "Mai always ________ so she can remember the lesson later.", options: ["takes notes", "writes notes"], ans: 0 },
                        { q: "We have to ________ online before 8 p.m.", options: ["submit an assignment", "send an assignment"], ans: 0 },
                        { q: "I couldn’t ________ because the classroom was too noisy.", options: ["concentrate", "focus attention"], ans: 0 },
                        { q: "Our group will ________ about environmental problems tomorrow.", options: ["give a presentation", "make a presentation talk"], ans: 0 },
                        { q: "Nam stayed up late to ________ for the English exam.", options: ["revise", "remember"], ans: 0 },
                        { q: "The teacher told us not to ________ during the listening activity.", options: ["make mistakes", "do mistakes"], ans: 0 },
                        { q: "I forgot my notebook, so I couldn’t ________ in class.", options: ["take notes", "write informations"], ans: 0 },
                        { q: "Students should ________ when the teacher explains something important.", options: ["ask questions", "make questions"], ans: 0 }
                    ]
                },
                {
                    type: "drag_drop",
                    title: "Activity 3: Paragraph Completion",
                    desc: "Drag words into the blanks. Correct drops will stick!",
                    paragraphs: [
                        {
                            title: "Paragraph 1 — Preparing for Exams",
                            words: ["revise for a test", "take notes", "assignment", "concentrate", "pay attention"],
                            text: "Tom is a hardworking student. Every afternoon, he goes to the library to study. He always tries to <span class='drop-zone' data-ans='pay attention'></span> during lessons because he wants to understand everything clearly. When the teacher explains important ideas, Tom carefully <span class='drop-zone' data-ans='take notes'></span> in his notebook. This week, he also needs to finish a science <span class='drop-zone' data-ans='assignment'></span> before Friday. Since exams are coming soon, he spends two hours every evening to <span class='drop-zone' data-ans='revise for a test'></span>."
                        },
                        {
                            title: "Paragraph 2 — School Presentation",
                            words: ["subject", "give a presentation", "ask questions", "timetable", "make mistakes"],
                            text: "Today, our English teacher showed us the new school <span class='drop-zone' data-ans='timetable'></span> for next month. In English class, each group had to <span class='drop-zone' data-ans='give a presentation'></span> about healthy study habits. Anna was nervous because she didn’t want to <span class='drop-zone' data-ans='make mistakes'></span> in front of the class. After the presentation, some students stayed behind to <span class='drop-zone' data-ans='ask questions'></span> about the project. Anna said English is her favorite <span class='drop-zone' data-ans='subject'></span> because she enjoys speaking activities very much."
                        }
                    ]
                },
                {
                    type: "speaking_choice",
                    title: "Activity 4: 3-minute Fluency Drill",
                    desc: "Choose ONE topic and practice speaking for 3 minutes.",
                    topics: [
                        {
                            title: "Topic 1 — My School Life",
                            prompt: "Talk about your school life, favorite subject, and study habits.",
                            includes: ["your favorite subject", "your timetable", "how you study for tests", "what you usually do in class", "how you prepare assignments"],
                            tryToUse: ["revise for a test", "take notes", "pay attention", "assignment", "concentrate"]
                        },
                        {
                            title: "Topic 2 — How I Study English",
                            prompt: "Talk about the way you study English and activities you enjoy.",
                            includes: ["when you study", "where you study", "how you revise", "what helps you concentrate", "what activities you enjoy in English class"],
                            tryToUse: ["revise for a test", "subject", "notebook", "ask questions", "give a presentation"]
                        }
                    ]
                }
            ]
        };

        // --- STATE ---
        let currentTaskIdx = 0;
        let fcPage = 0;
        let mcqPage = 0;
        let mcqAnswers = {};
        let currentParaIdx = 0;

        // --- CORE NAVIGATION ---
        function goHome() {
            if(confirm("Exit lesson? Progress will be lost.")) {
                window.location.href = "../index.html"; 
            }
        }

        function updateProgress(p) {
            document.getElementById('progress-bar').style.width = p + '%';
            document.getElementById('progress-text').innerText = Math.round(p) + '%';
        }

        function handleNextTask() {
            currentTaskIdx++;
            renderTask();
        }

        function renderTask() {
            const task = lessonData.tasks[currentTaskIdx];
            const container = document.getElementById('task-container');
            const nav = document.getElementById('global-nav');
            
            if (!task) {
                completeLessonUI();
                return;
            }

            nav.classList.add('hidden');
            updateProgress((currentTaskIdx / lessonData.tasks.length) * 100);

            container.innerHTML = `
                <div class="mb-10 text-center fade-in">
                    <span class="bg-indigo-100 text-indigo-700 text-sm font-bold px-4 py-1.5 rounded-full uppercase tracking-widest">${task.title.split(':')[0]}</span>
                    <h2 class="text-3xl font-extrabold mt-4 text-gray-800">${task.title.split(':')[1]}</h2>
                    <p class="text-gray-500 mt-2 text-lg">${task.desc}</p>
                </div>
                <div id="sub-content" class="max-w-5xl mx-auto"></div>
            `;

            const sub = document.getElementById('sub-content');
            if (task.type === 'recall_flashcard') renderRecall(task, sub);
            else if (task.type === 'mcq_batch') renderMCQ(task, sub);
            else if (task.type === 'drag_drop') renderDD(task, sub);
            else if (task.type === 'speaking_choice') renderSpeaking(task, sub);
        }

        // ================= ACTIVITY 1: RECALL FLASHCARD =================
        function renderRecall(task, sub) {
            fcPage = 0;
            const draw = () => {
                const start = fcPage * 10;
                const items = task.items.slice(start, start + 10);
                const totalP = Math.ceil(task.items.length / 10);
                
                sub.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 fade-in">
                        ${items.map((item, i) => `
                            <div class="perspective-1000 mini-card" id="card-${start+i}">
                                <div class="flashcard-inner relative w-full h-full transform-style-3d shadow-md rounded-2xl border border-gray-100 bg-white">
                                    <div class="absolute inset-0 backface-hidden p-4 flex flex-col justify-between items-center text-center">
                                        <span class="text-[10px] font-bold text-indigo-400 bg-indigo-50 px-2 py-0.5 rounded-full uppercase">${item.type}</span>
                                        <div class="flex-1 flex flex-col justify-center">
                                            <p class="text-xs text-gray-400 font-bold mb-1">${item.en}</p>
                                            <p class="text-lg font-black text-indigo-600 leading-tight">${item.vn}</p>
                                        </div>
                                        <input type="text" placeholder="Type word..." 
                                               onkeypress="if(event.key==='Enter') checkRecall(${start+i}, '${item.word.replace(/'/g,"\\'")}')"
                                               class="w-full text-center text-sm border-2 border-gray-100 rounded-lg p-2 focus:border-indigo-500 outline-none">
                                    </div>
                                    <div class="absolute inset-0 backface-hidden bg-indigo-600 rounded-2xl flex flex-col justify-center items-center rotate-y-180 text-white p-4">
                                        <i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-3"></i>
                                        <h3 class="text-xl font-black text-center">${item.word}</h3>
                                        <button onclick="playAudio('${item.word}')" class="mt-4 bg-indigo-500 hover:bg-indigo-400 w-10 h-10 rounded-full">
                                            <i class="fa-solid fa-volume-high"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="mt-10 flex justify-center items-center gap-6">
                        <button onclick="changeFCPage(-1)" ${fcPage===0?'disabled':''} class="w-12 h-12 bg-white rounded-full shadow disabled:opacity-30"><i class="fa-solid fa-chevron-left"></i></button>
                        <span class="font-bold text-gray-500">Page ${fcPage+1} / ${totalP}</span>
                        <button onclick="changeFCPage(1)" ${fcPage===totalP-1?'disabled':''} class="w-12 h-12 bg-white rounded-full shadow disabled:opacity-30"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                `;
                if(fcPage === totalP - 1) document.getElementById('global-nav').classList.remove('hidden');
            };
            window.changeFCPage = (dir) => { fcPage += dir; draw(); };
            draw();
        }

        function checkRecall(id, correct) {
            const card = document.getElementById(`card-${id}`);
            const input = card.querySelector('input');
            if(input.value.trim().toLowerCase() === correct.toLowerCase()) {
                card.querySelector('.flashcard-inner').style.transform = 'rotateY(180deg)';
                card.classList.add('flipped');
            } else {
                card.classList.add('shake');
                input.style.borderColor = '#ef4444';
                setTimeout(() => { card.classList.remove('shake'); input.style.borderColor = '#f1f5f9'; }, 400);
            }
        }

        // ================= ACTIVITY 2: MCQ BATCH =================
        function renderMCQ(task, sub) {
            mcqPage = 0;
            mcqAnswers = {};
            const draw = () => {
                const start = mcqPage * 5;
                const qs = task.questions.slice(start, start + 5);
                sub.innerHTML = `
                    <div class="space-y-6 fade-in">
                        ${qs.map((q, i) => `
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                <p class="text-xl font-bold text-gray-800 mb-4">${start+i+1}. ${q.q.replace('________', '<span class="text-indigo-600 border-b-2 border-indigo-200 px-3">...</span>')}</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    ${q.options.map((opt, oi) => `
                                        <button onclick="selectMCQ(${start+i}, ${oi})" id="opt-${start+i}-${oi}" 
                                                class="q-${start+i} text-left p-4 rounded-xl border-2 border-gray-50 hover:border-indigo-200 transition-all font-semibold">
                                            <span class="text-gray-300 mr-2">${oi===0?'A':'B'}.</span> ${opt}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                        <div class="text-center pt-6">
                            <button id="btn-check-page" onclick="checkMCQPage()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 px-12 rounded-2xl shadow-lg">Check Page Results</button>
                        </div>
                        <div id="mcq-feedback" class="text-center font-bold text-xl h-8 mt-4"></div>
                    </div>
                `;
            };
            
            window.selectMCQ = (qi, oi) => {
                document.querySelectorAll(`.q-${qi}`).forEach(b => b.className = `q-${qi} text-left p-4 rounded-xl border-2 border-gray-50 hover:border-indigo-200 font-semibold`);
                document.getElementById(`opt-${qi}-${oi}`).classList.add('bg-indigo-50', 'border-indigo-500', 'text-indigo-700');
                mcqAnswers[qi] = oi;
            };

            window.checkMCQPage = () => {
                const start = mcqPage * 5;
                let answeredCount = 0;
                for(let i=start; i<start+5; i++) if(mcqAnswers[i] !== undefined) answeredCount++;
                if(answeredCount < 5) { alert("Please answer all questions!"); return; }

                for(let i=start; i<start+5; i++){
                    const correct = task.questions[i].ans;
                    const user = mcqAnswers[i];
                    document.querySelectorAll(`.q-${i}`).forEach(b => b.disabled = true);
                    if(user === correct) document.getElementById(`opt-${i}-${user}`).classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
                    else {
                        document.getElementById(`opt-${i}-${user}`).classList.add('bg-red-50', 'border-red-500', 'text-red-700');
                        document.getElementById(`opt-${i}-${correct}`).classList.add('bg-emerald-50', 'border-emerald-500');
                    }
                }

                if(mcqPage === 0) {
                    const btn = document.getElementById('btn-check-page');
                    btn.innerHTML = 'Next 5 Questions <i class="fa-solid fa-arrow-right"></i>';
                    btn.onclick = () => { mcqPage = 1; draw(); };
                } else {
                    let score = 0;
                    task.questions.forEach((q, i) => { if(mcqAnswers[i] === q.ans) score++; });
                    const f = document.getElementById('mcq-feedback');
                    if(score >= 8) {
                        f.innerHTML = `<span class="text-emerald-600">Well done! Score: ${score}/10.</span>`;
                        document.getElementById('global-nav').classList.remove('hidden');
                        document.getElementById('btn-check-page').classList.add('hidden');
                    } else {
                        f.innerHTML = `<span class="text-red-500">Score: ${score}/10. You need 8 to pass.</span>`;
                        const btn = document.getElementById('btn-check-page');
                        btn.innerHTML = 'Try Again <i class="fa-solid fa-rotate-right"></i>';
                        btn.onclick = () => { mcqAnswers = {}; mcqPage = 0; draw(); };
                    }
                }
            };
            draw();
        }

        // ================= ACTIVITY 3: DRAG AND DROP =================
        function renderDD(task, sub) {
            currentParaIdx = 0;
            const draw = () => {
                const p = task.paragraphs[currentParaIdx];
                sub.innerHTML = `
                    <div class="bg-indigo-50 p-6 rounded-3xl mb-8 border border-indigo-100 flex flex-wrap gap-3 justify-center" id="word-bank">
                        ${p.words.map(w => `<span class="draggable-word bg-white px-4 py-2 rounded-xl shadow-sm border-2 border-indigo-200 font-bold text-indigo-700" draggable="true" ondragstart="drag(event, '${w}')">${w}</span>`).join('')}
                    </div>
                    <div class="bg-white p-10 lg:p-14 rounded-[3rem] shadow-xl border border-gray-100 leading-loose text-xl text-gray-700">
                        <h3 class="text-2xl font-black mb-6 text-gray-800 border-b pb-4">${p.title}</h3>
                        <p id="paragraph-content">${p.text}</p>
                    </div>
                    <div id="para-nav" class="mt-8 flex justify-center hidden">
                        <button onclick="nextPara()" class="bg-indigo-500 text-white px-8 py-3 rounded-2xl font-bold shadow-lg">Next Paragraph <i class="fa-solid fa-chevron-right ml-2"></i></button>
                    </div>
                `;
                initDD();
            };

            window.drag = (e, val) => { e.dataTransfer.setData("val", val); };
            window.initDD = () => {
                document.querySelectorAll('.drop-zone').forEach(zone => {
                    zone.ondragover = (e) => e.preventDefault();
                    zone.ondrop = (e) => {
                        const val = e.dataTransfer.getData("val");
                        const ans = e.target.getAttribute("data-ans");
                        if(val === ans) {
                            e.target.innerText = val;
                            e.target.classList.add('filled');
                            document.querySelectorAll('.draggable-word').forEach(el => { if(el.innerText === val) el.style.visibility = 'hidden'; });
                            checkDDCompletion();
                        } else {
                            e.target.classList.add('shake');
                            setTimeout(() => e.target.classList.remove('shake'), 400);
                        }
                    };
                });
            };

            window.checkDDCompletion = () => {
                if(document.querySelectorAll('.drop-zone:not(.filled)').length === 0) {
                    if(currentParaIdx < task.paragraphs.length - 1) {
                        document.getElementById('para-nav').classList.remove('hidden');
                    } else {
                        document.getElementById('global-nav').classList.remove('hidden');
                    }
                }
            };

            window.nextPara = () => { currentParaIdx++; draw(); };
            draw();
        }

        // ================= ACTIVITY 4: SPEAKING =================
        function renderSpeaking(task, sub) {
            sub.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    ${task.topics.map((t, i) => `
                        <div class="bg-white p-8 rounded-[2.5rem] border-4 border-transparent shadow-xl cursor-pointer hover:border-indigo-400 transition-all flex flex-col group topic-card" onclick="selectTopic(${i}, this)">
                            <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-indigo-600 transition-colors">
                                <i class="fa-solid fa-microphone-lines text-2xl text-indigo-600 group-hover:text-white"></i>
                            </div>
                            <h3 class="text-2xl font-black text-gray-800 mb-2">${t.title}</h3>
                            <p class="text-indigo-600 font-bold mb-4">"${t.prompt}"</p>
                            <div class="flex-1 space-y-4">
                                <div>
                                    <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Try to use:</p>
                                    <div class="flex flex-wrap gap-2">
                                        ${t.tryToUse.map(w => `<span class="bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1 rounded-lg border border-emerald-100">${w}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                            <div class="mt-8 text-center hidden check-mark">
                                <span class="bg-emerald-500 text-white px-6 py-2 rounded-full font-bold">Topic Selected <i class="fa-solid fa-check ml-1"></i></span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            window.selectTopic = (idx, el) => {
                document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('border-indigo-400', 'bg-indigo-50/50'));
                document.querySelectorAll('.check-mark').forEach(m => m.classList.add('hidden'));
                el.classList.add('border-indigo-400', 'bg-indigo-50/50');
                el.querySelector('.check-mark').classList.remove('hidden');
                document.getElementById('global-nav').classList.remove('hidden');
                document.getElementById('btn-next-global').innerHTML = 'Finish Lesson 2 <i class="fa-solid fa-trophy ml-2"></i>';
            };
        }

        // ================= HELPERS =================
        function completeLessonUI() {
            document.getElementById('task-container').innerHTML = `
                <div class="text-center py-20 fade-in">
                    <div class="inline-block bg-yellow-100 p-10 rounded-full mb-8 relative">
                        <i class="fa-solid fa-trophy text-7xl text-yellow-500 animate-bounce"></i>
                    </div>
                    <h2 class="text-5xl font-black text-indigo-600 mb-4">Lesson Complete!</h2>
                    <p class="text-gray-500 text-xl mb-12">You've mastered Lesson 2 activities.</p>
                    <button onclick="location.reload()" class="bg-indigo-600 text-white font-black py-5 px-16 rounded-3xl shadow-xl text-xl transition active:scale-95">Restart Lesson</button>
                </div>
            `;
            updateProgress(100);
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US'; u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }
        }

        window.onload = renderTask;
    </script>
</body>
</html>
